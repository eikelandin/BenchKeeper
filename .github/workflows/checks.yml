name: Checks

# `checks` is the required check, a gate over the parallel jobs it needs.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-core:
    if: github.repository == 'CedarLoom/cedarloom'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image digest is bumped by hand: Dependabot does not read `run:` lines.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo docker.io/rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color # 1.7.12
      # REUSE 3.3: every file has a copyright and a license through REUSE.toml; the CedarLoom name and logos are LicenseRef-Brand.
      # A docker step because the allowed-actions list lacks fsfe/reuse-action; the image trusts git only at /data.
      - name: REUSE
        run: docker run --rm -v "$PWD":/data:ro -w /data docker.io/fsfe/reuse@sha256:2748d04c2adeb747c9a44831bc99a9cbfd7bf7ff6fc371a4b63204944e3e47b6 lint # 6.3.0
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          inputs: .github
      # Em dash and emoji in tracked text files; lockfiles, PNG files and the generated changelogs (release-please's breaking-changes heading has U+26A0) excluded.
      - name: Forbidden characters
        run: |
          # git grep: 0 match, 1 no match, anything else an error (for example a pattern PCRE rejects).
          rc=0
          git grep -nIP '\x{2014}|[\x{1F000}-\x{1FAFF}\x{2300}-\x{23FF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]|\x{FE0F}' -- . ':!*package-lock.json' ':!*.png' ':!*CHANGELOG.md' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::em dash or emoji found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::git grep failed ($rc)"; exit 1; fi
      # One minimum Claude Code version, stated in the README's Requirements: any other 2.1.x version fails. Changelogs, tests, package manifests and lockfiles, workflows (action pin comments) and the CI pin are exempt.
      - name: Claude Code version
        run: |
          rc=0
          git grep -nIP '(?<![\d.])2\.1\.(?!323(?!\d))\d+' -- . ':!*CHANGELOG.md' ':!.github/claude-code' ':!*.test.*' ':!*/test/*' ':!.github/workflows' ':!*package-lock.json' ':!*package.json' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::a Claude Code version other than the minimum 2.1.323 found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::git grep failed ($rc)"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # Own skills: front matter, name, quoted description, size, link targets, Codex policy.
      - name: Skill lint
        run: node --test .github/scripts/skill-lint.test.mjs && node .github/scripts/skill-lint.mjs
      - name: PR title pattern
        run: node --test .github/scripts/pr-title.test.mjs
      # A plugin installs as its folder alone: paths outside it, imports of other packages and another plugin's matcher prefix fail, and Orca text fails outside cl-orchestration and the cedarloom bundle.
      - name: Plugin boundary
        run: node --test .github/scripts/plugin-boundary.test.mjs && node .github/scripts/plugin-boundary.mjs
      # release.yml never lets a later push cancel the release job.
      - name: Release workflows
        run: node --test .github/scripts/release-workflows.test.mjs
      # The docs/skills.md table is generated from the skills' front matter.
      - name: Skills page
        run: node --test .github/scripts/skills-doc.test.mjs && node .github/scripts/skills-doc.mjs --check
      # Plugin install lines in the docs that name a release tag name the plugins version (#cedarloom-v<x.y.z>).
      - name: Version pins
        run: node --test .github/scripts/version-pins.test.mjs && node .github/scripts/version-pins.mjs --check
      # The budget in .github/token-budget.json binds here, a required check; token-budget.yml only comments the change.
      - name: Token budget
        run: node plugins/*/skills/debloat/token-budget.mjs check --budget-only

  # Each plugin as Claude Code reads it: manifest and skill front matter (strict), the marketplace file, the mod tests, an install of each plugin. Claude Code is pinned by `.github/claude-code/package-lock.json` (the `stable` tag of its npm package); bump it by hand.
  plugin-checks:
    if: github.repository == 'CedarLoom/cedarloom'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Install Claude Code
        working-directory: .github/claude-code
        # No install scripts: the native binary of the runner's platform package goes on PATH instead of the postinstall copy.
        run: npm ci --ignore-scripts --no-audit --no-fund && echo "$PWD/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Validate the plugins and the marketplace
        run: |
          shopt -s failglob
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict
          done
          claude plugin validate .
      - name: Plugin mod tests
        run: |
          shopt -s failglob
          for mods in plugins/*/hooks/claude-code.json; do
            claude plugin test "${mods%/hooks/claude-code.json}"
          done
      # A broken manifest and a broken skill front matter must fail the validation (fixtures built from a valid scratch plugin).
      - name: Validation fixtures
        run: node --test .github/scripts/plugin-validate.test.mjs
      - name: Install each plugin and the bundle into an empty config
        run: node --test .github/scripts/plugin-install.test.mjs

  # The plugins' scripts and hooks under Node.js alone: no app and no install.
  plugin-tests:
    if: github.repository == 'CedarLoom/cedarloom'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on pull requests once the repository is public; while it is private, on pushes to main only.
        os: ${{ fromJSON((github.event_name == 'push' || !github.event.repository.private) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Plugin tests
        run: |
          shopt -s failglob
          for dir in plugins/*/test; do
            node --import ./.github/scripts/plugin-test-env.mjs --test "$dir"/*.test.mjs
          done

  # Required check: passes when all parallel jobs pass.
  checks:
    if: always() && github.repository == 'CedarLoom/cedarloom'
    needs: [checks-core, plugin-checks, plugin-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "::error::a needed job ended as $r"; exit 1; fi
          done

  dependency-review:
    if: github.repository == 'CedarLoom/cedarloom' && github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
