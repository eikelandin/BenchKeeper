# Version updates for the `uses:` pins (SHA plus version comment) and the npm packages of the site.
# Not covered, bumped by hand: the actionlint image digest in checks.yml, node-version (checks and pages workflows) and
# the Node image of .devcontainer/Dockerfile. Each version update waits until the release is 3
# days old (cooldown): a release withdrawn within that time never reaches a version-update pull request. Security updates
# are not delayed (the cooldown applies to version updates only), so they can name a newer release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  # @playwright/test is in no group: the dev container installs the same version's browser, and the version pins check
  # fails until web/package.json and .devcontainer/Dockerfile agree. Its own pull request says a release is out; raise
  # both by hand in one pull request, which closes it.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      web:
        update-types: [minor, patch]
        exclude-patterns: ['@playwright/test']
