# Version updates for the `uses:` pins (SHA plus version comment).
# Not covered, bumped by hand: the actionlint image digest in checks.yml, node-version in the workflows and
# the Node image of .devcontainer/Dockerfile. Each version update waits until the release is 3
# days old (cooldown): a release withdrawn within that time never reaches a version-update pull request. Security updates
# are not delayed (the cooldown applies to version updates only), so they can name a newer release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
